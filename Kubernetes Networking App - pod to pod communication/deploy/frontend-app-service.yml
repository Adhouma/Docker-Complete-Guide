apiVersion: v1
kind: Service
metadata:
  name: frontend-app-service
spec:
  selector:
    app: frontend-app
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

# Run this service with
# kubectl apply -f ./deploy/frontend-app-service.yml

# Expose the service in your machine http://127.0.0.1:62545 for example using this command
# minikube service frontend-app-service