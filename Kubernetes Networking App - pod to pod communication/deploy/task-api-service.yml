apiVersion: v1
kind: Service
metadata:
  name: task-api-service
spec:
  selector:
    app: task-api
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

# Run this service with
# kubectl apply -f ./deploy/task-api-service.yml

# Expose the service in your machine http://127.0.0.1:62545 for example using this command
# minikube service task-api-service